{{/*  Variables  */}}

<div class="feature bg-zinc-900 text-white relative flex flex-col">
    {{ partial "atoms/reel" . }}
    
    <div class="container relative z-1 min-h-[600px] mx-auto max-w-7xl flex flex-col md:flex-row">
        {{ $latest := first 1 (sort .RegularPages "Date" "desc") }}
        {{ with index $latest 0 }}

        <div class="reigning-champ w-full md:w-2/3 xl:w-3/5 2xl:w-1/2 flex items-center">
            {{ partial "molecules/champ" . }}
        </div>

        <div class="losers bg-zinc-900 w-full md:w-1/3 xl:w-2/5 2xl:w-1/2 ">
            {{ partial "molecules/losers" . }}
        </div>
        
        {{ end }}
    </div>
   
</div>
