{{ $latest := first 1 (sort .RegularPages "Date" "desc") }}
{{ with index $latest 0 }}

<div class="mk-feature relative z-1 bg-zinc-900 {{ (index .Params.players 0).character }} text-white relative flex flex-col">
 
    {{/*  TODO: Fix video responsive  */}}
    {{ if .Params.reel }}
        {{ partial "atoms/reel" . }}
    {{ end }}
    
    <div class="container relative z-1 min-h-[600px] mx-auto max-w-7xl flex flex-col md:flex-row">

        {{/*  TODO: Redesign  */}}
        <div class="reigning-champ w-full md:w-2/3 xl:w-3/5">
            {{ partial "molecules/champ" . }}
        </div>

        <div class="losers w-full md:w-1/3 xl:w-2/5">
            {{ partial "molecules/losers" . }}
        </div>
    
    </div>

</div>

{{ end }}
