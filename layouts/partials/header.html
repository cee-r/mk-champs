<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        
        <link rel="shortcut icon" href="favicon.ico">

        <title>{{ .Title }}</title>
        
        {{ with (templates.Defer (dict "key" "global")) }}
            {{ partial "css.html" . }}
        {{ end }}

        <script src="https://kit.fontawesome.com/627d3e354c.js" crossorigin="anonymous"></script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <!-- Styles & Scripts -->
        {{ $style := resources.Get "/css/mkchamp.scss" | css.Sass | resources.Minify | resources.Fingerprint }}
        <link rel="stylesheet" href="{{ $style.RelPermalink }}">

        {{ $js := resources.Get "/js/main.js"}}
        <script type="text/javascript" src="{{ $js.RelPermalink }}"></script>

    </head>

    <body class="font-roboto w-full h-screen">
