baseURL = 'https://cee-r.github.io/'
languageCode = 'en-us'
title = 'Mario Kart Champions'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  base_path = '/mk-champs'

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'